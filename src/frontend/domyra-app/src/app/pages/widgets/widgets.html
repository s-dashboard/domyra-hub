<button matButton type="button" (click)="onInstallClick()">Install widget <mat-icon>add</mat-icon></button>
<table mat-table [dataSource]="dataSource()">

  <!-- Alias Column -->
  <ng-container matColumnDef="alias">
    <th mat-header-cell *matHeaderCellDef>Alias</th>
    <td mat-cell *matCellDef="let element">
      {{ element.alias }}
    </td>
  </ng-container>

  <!-- State Column -->
  <ng-container matColumnDef="state">
    <th mat-header-cell *matHeaderCellDef class="widget-state">State</th>
    <td mat-cell *matCellDef="let element">
      <button matIconButton type="button" (click)="onActivateClick(element)">
        @if(element.state === 0) {
          <mat-icon>flash_off</mat-icon>
        }

        @if(element.state === 1) {
          <mat-icon>flash_on</mat-icon>
        }
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
