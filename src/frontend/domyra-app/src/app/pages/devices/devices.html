<button matButton type="button" (click)="onAddClick()">Add device <mat-icon>add</mat-icon></button>
<table mat-table [dataSource]="dataSource()">
  <!-- Id Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef class="device-id">DeviceId</th>
    <td mat-cell *matCellDef="let element">{{ element.id }}</td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let element">
      <a href="/devices/{{ element.id }}">{{ element.name }}</a>
    </td>
  </ng-container>

  <!-- State Column -->
  <ng-container matColumnDef="state">
    <th mat-header-cell *matHeaderCellDef class="device-state">State</th>
    <td mat-cell *matCellDef="let element">
      <button matIconButton type="button" (click)="onActivateClick(element)">
        @if(element.state === 0) {
          <mat-icon>flash_off</mat-icon>
        }

        @if(element.state === 1) {
          <mat-icon>flash_on</mat-icon>
        }
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
